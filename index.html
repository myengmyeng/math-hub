<style>

<div id="pick" class="scr"><h1>수업 허브</h1><div class="msg" id="pickMsg"></div>
  <div class="grade"><b>학년</b><div class="pad" id="pG"></div></div>

<div id="main" class="scr">
  <div id="top"><span class="who" id="who"></span><span class="act" id="actT"></span><span id="star" class="star"></span><button id="hwB" class="hwb" style="display:none">📝 과제</button></div>

var SB_KEY = 'sb_publishable_S4gxcXRMSJb6K0G5ncQYGw_I8ZRLONa';
var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
var MIR = {}, PRES = {}, LAT = {}, ROOM = {}, CODE = null, TEACHER = /teacher/.test(location.pathname), WQ = Promise.resolve();
window.__SB = { MIR: MIR, PRES: PRES, ROOM: ROOM };   // 확인용

function fail_(m) { console.warn('저장 실패', m); window.dispatchEvent(new CustomEvent('hubfail', { detail: m })); }
/* 선생님 쓰기 — 순서가 뒤바뀌지 않게 하나씩 */
function put_(k, v) {
  if (MIR[k] === v) return;
  if (v === '' || v == null) delete MIR[k]; else MIR[k] = v;
  WQ = WQ.then(function () {
    return sb.rpc('t_put', { c: CODE, k: k, v: v === '' ? null : v }).then(function (r) { if (r.error || r.data === false) fail_(r.error ? r.error.message : '진도판 코드가 맞지 않아요'); });
  });
}
/* 반 채널 하나 = Presence(학생 상태). 학생은 자기 키로 들어가 track, 선생님은 듣기만 */
function room_(cls, key) {
  if (ROOM[cls]) return ROOM[cls];
  if (key) watch_(cls);
  var ch = sb.channel('room:' + cls, { config: { presence: { key: key || 'T' + Math.random().toString(36).slice(2) } } });
  ch.on('presence', { event: 'sync' }, function () {
    var st = ch.presenceState(), now = Date.now();
    Object.keys(PRES).forEach(function (k) { if (k.indexOf('S:' + cls + ':') === 0 && !st[k]) delete PRES[k]; });
    Object.keys(st).forEach(function (k) {
      if (k.indexOf('S:') !== 0) return;
      var m = st[k][st[k].length - 1];
      /* 반영 시간 = 선생님이 바꾼 시각(v, 선생님 시계) → 학생이 받았다고 알려 온 시각(선생님 시계). 왕복이라 기기 시계 차이가 없다 */
      if (m.gv && !LAT[k + m.gv]) LAT[k + m.gv] = now - m.gv;
      m.lat = LAT[k + m.gv] || 0;
      PRES[k] = m;
    });
  });
  ch.subscribe(function (s) {
    if (s === 'SUBSCRIBED') { if (ch._me) ch.track(ch._me); return; }
    if (ROOM[cls] === ch) { delete ROOM[cls]; sb.removeChannel(ch); }   // 끊기면 다음 묻기 때 새로 들어간다
  });
  return (ROOM[cls] = ch);
}
var ST = {
  code: function () { return CODE; },
  url: function () { return location.href.replace(/[^/]*([?#].*)?$/, ''); },
  now: function () { return Date.now(); },   // ponytail: 기기 시계를 그대로 씀(태블릿은 자동 시각이라 1초 안팎). 타이머가 어긋나면 서버 시각 받기
  cget: function (k) {
    if (k.indexOf('S:') === 0) { var m = PRES[k]; if (!m) return null; m.t = Date.now(); return JSON.stringify(m); }
    return MIR[k] == null ? null : MIR[k];
  },
  cgetAll: function (ks) { var o = {}; ks.forEach(function (k) { var v = ST.cget(k); if (v != null) o[k] = v; }); return o; },
  cscan: function (p) {
    var cls = p.split(':')[1]; if (cls) room_(cls);
    return Object.keys(PRES).filter(function (k) { return k.indexOf(p) === 0; }).map(function (k) { return k.slice(p.length); });
  },
  cput: function (k, v) {
    if (k.indexOf('S:') === 0) {   // 학생 자기 상태 → Presence. 바뀐 것만(t 빼고 비교)
      var m = j_(v, {}), cls = k.split(':')[1], ch = room_(cls, k);
      delete m.t; delete m.lat; delete m.presence_ref;   // 서버가 붙이는 꼬리표까지 비교하면 끝없이 다시 보내다 채널이 닫힌다
      var js = JSON.stringify(m); if (ch._js === js) return; ch._js = js; ch._me = m;
      if (ch.state === 'joined') ch.track(m);
      return;
    }
    if (k.indexOf('L:') === 0 || k.indexOf('RJ:') === 0 && v === '') return;   // 진도판 열림 신호는 필요 없음(언제나 바로), 거절 알림 지우기는 s_login 이 함
    put_(k, v);
  },
  pget: function (k) { return MIR[k] == null ? null : MIR[k]; },
  pset: put_,
  lock: function (fn) { return fn(); },   // ponytail: 선생님 한 명 기준(마지막 저장이 이김). 학생 쓰기는 DB 함수가 잠근다
  deckFolder: function () { return 'D' + Date.now(); },
  delPrefix: function (p) {
    Object.keys(MIR).forEach(function (k) { if (k.indexOf(p) === 0) delete MIR[k]; });
    WQ = WQ.then(function () { return sb.rpc('t_del', { c: CODE, p: p }); });
  },
  fileData: function (id) {
    return sb.from('files').select('v').eq('k', id).single().then(function (r) { if (r.error) throw r.error.message; return r.data.v; });
  }
};
/* 시작: kv 거울 채우기 + 바뀔 때마다 알림.
 * 선생님 기기는 전부, 학생은 답(A:·GA:)을 빼고 받고, 실시간은 자기 반 키만(watch_ — 반을 알게 된 뒤) */
function sub_(filter, keys) {
  var o = { event: '*', schema: 'public', table: 'kv' }; if (filter) o.filter = filter;
  var ch = sb.channel('kv:' + (filter || 'all')).on('postgres_changes', o, function (e) {
    if (e.eventType === 'DELETE') { delete MIR[e.old.k]; return; }
    MIR[e.new.k] = e.new.v;
  });
  ch.subscribe(function (s) {   // 구독 전에 바뀐 것을 놓치지 않게 한 번 더 읽는다
    if (s === 'SUBSCRIBED' && keys) sb.from('kv').select('k,v').in('k', keys).then(function (r) {
      if (r.error) return;
      keys.forEach(function (k) { delete MIR[k]; }); r.data.forEach(function (x) { MIR[x.k] = x.v; });
    });
  });
}
var WATCH = null;
function watch_(cls) {
  if (TEACHER || WATCH === cls) return; WATCH = cls;
  var keys = ['P:' + cls, 'B:' + cls, 'GQ:' + cls, 'SNAP:' + cls, 'STK:' + cls, 'NICK:' + cls, 'STAR:' + cls, 'HW:' + cls, 'DECK', 'CLASSES'];
  sub_('k=in.(' + keys.map(function (k) { return '"' + k + '"'; }).join(',') + ')', keys);
}
var HUB_READY = (function () {
  var q = sb.from('kv').select('k,v');
  if (!TEACHER) q = q.not('k', 'like', 'A:%').not('k', 'like', 'GA:%');
  return q.then(function (r) {
    if (r.error) throw r.error.message;
    r.data.forEach(function (x) { MIR[x.k] = x.v; });   // ponytail: 1000 줄까지 한 번에(Supabase 기본). 답은 질문·게임이 끝나면 지워서 넘지 않게
    if (TEACHER) sub_(null, null);
  });
})();

/* 수학 수업 허브 — 서버 로직. 브라우저 안에서 돈다(build.py 가 저장소 어댑터와 함께 감싼다).
 *  - 로컬 확인: fake.js(localStorage) · 배포: supa.js(Supabase 거울 + 실시간). 학생이 쓰는 login·answer 는 supa 에선 DB 함수(supabase.sql)가 같은 규칙으로 대신한다.
 * 저장은 모두 ST(저장소 어댑터)를 거친다: cget/cput/cgetAll/cscan(캐시) · pget/pset(속성) · lock · now · code · 파일.
 * 키: CLASSES · B:반(태블릿 묶음) · Q:반(허락 대기) · RJ:…(거절 알림) · P:반(수업 상태) · L:반(진도판 열림) · SEQ:활동 · DECK · DECK:t
 *     S:반:번호(학생 현재 상태 — supa 에선 Presence) · A:반:질문:번호(즉석 질문 답)
 *     게임: GQ:반(공개 상태, 정답은 공개 단계에서만) · GC:반(리모컨 '다음' 신호) · GA:반:게임:문항:번호(답) · GSETS(세트 목록)
 *     세트 본문(정답)·게임 기록은 비공개 저장소(setSave/setLoad — supa 는 sets 표), 문제 그림은 파일(GI:게임:문항)
 * 명렬표 없음: 학생이 학년·반·번호를 넣고 수업마다 닉네임을 정한다. 실명은 저장하지 않는다.
 */
var DEMO = '체험';
var PACE_KEYS = ['act', 'sync', 'from', 'to', 'pause', 'msg', 'timer', 'show', 'page', 'q'];

function j_(s, d) { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } }
/* 캐시 먼저, 없으면 속성에서 읽어 캐시에 다시 올린다 */
function rd_(k, d) {
  var v = ST.cget(k);
  if (v == null) { v = ST.pget(k); if (v != null) ST.cput(k, v); }
  return j_(v, d);
}
function wr_(k, o) { var s = JSON.stringify(o); ST.pset(k, s); ST.cput(k, s); return o; }
function okCode_(c) { var k = ST.code(); return !!k && String(c) === String(k); }
function str_(s, n) { return String(s == null ? '' : s).replace(/[<>]/g, '').slice(0, n || 100); }
function paceBlank_() { return { v: 0, act: null, sync: null, from: null, to: null, pause: false, msg: '', timer: null, show: null, page: 0, q: null }; }
/* 반 이름은 '학년-반'(1~3학년, 1~15반) 또는 체험. 번호는 1~45(체험은 1~5) */
function okWho_(cls, no) { return cls === DEMO ? no >= 1 && no <= 5 : /^[1-3]-([1-9]|1[0-5])$/.test(cls) && no >= 1 && no <= 45; }
/* 진도판에 보일 번호 = 태블릿이 묶인 번호 + 지금 접속한 번호 */
/* 선생님이 바꾼 닉네임(NICK:반 {번호:{n, d}}) — 그날만 */
function day_() { var d = new Date(ST.now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function nick_(cls) { var a = rd_('NICK:' + cls, {}) || {}, o = {}, d = day_(); Object.keys(a).forEach(function (n) { if (a[n] && a[n].d === d && a[n].n) o[n] = a[n].n; }); return o; }
function nos_(cls) {
  var s = {};
  if (cls === DEMO) [1, 2, 3, 4, 5].forEach(function (n) { s[n] = 1; });
  Object.keys(rd_('B:' + cls, {})).forEach(function (n) { s[n] = 1; });
  ST.cscan('S:' + cls + ':').forEach(function (n) { s[n] = 1; });
  return Object.keys(s).map(Number).filter(function (n) { return n > 0; }).sort(function (a, b) { return a - b; });
}

/* ---------------- 학생 ---------------- */
/* 학년·반·번호를 넣으면: 처음이면 이 태블릿에 묶고, 다른 태블릿에 묶여 있으면 선생님 허락을 기다린다.
 * supabase.sql 의 s_login 이 같은 규칙 — 여기를 고치면 거기도 고칠 것 */
function login(cls, no, dev) {
  cls = String(cls); no = Number(no); dev = str_(dev, 40);
  if (!okWho_(cls, no)) return { ok: false, msg: '학년·반·번호를 다시 확인해 주세요' };
  if (cls === DEMO) return { ok: true };
  var rj = 'RJ:' + cls + ':' + no + ':' + dev;
  if (ST.cget(rj)) { ST.cput(rj, '', 1); return { ok: false, rejected: true }; }
  var b = rd_('B:' + cls, {});
  if (b[no] === dev) return { ok: true };
  return ST.lock(function () {
    b = j_(ST.pget('B:' + cls), {});
    if (!b[no] || b[no] === dev) {
      b[no] = dev; wr_('B:' + cls, b);
      var l = rd_('CLASSES', []);
      if (l.indexOf(cls) < 0) { l.push(cls); l.sort(function (x, y) { return x.localeCompare(y, 'ko', { numeric: true }); }); wr_('CLASSES', l); }
      return { ok: true };
    }
    var q = j_(ST.pget('Q:' + cls), []), has = false;
    q.forEach(function (x) { if (x.no === no && x.dev === dev) has = true; });
    if (!has) { q.push({ no: no, dev: dev, t: ST.now() }); wr_('Q:' + cls, q); }
    return { ok: false, pending: true };
  });
}

/* 학생이 자주 부른다(로컬 2~5초, supa 는 거울만 읽어서 0.4초). 바뀐 게 없으면 상태를 보내지 않는다.
 * info = { act, scr, sig, prog, help, nick, ani } — 진도판 현황표용 */
function pull(cls, no, dev, v, info, seen) {
  seen = typeof seen === 'object' && seen ? seen : { g: seen };
  cls = String(cls); no = Number(no);
  var now = ST.now(), sk = 'S:' + cls + ':' + no;
  var c = ST.cgetAll(['P:' + cls, 'B:' + cls, 'DECK', 'L:' + cls, sk]);
  var p = c['P:' + cls] != null ? j_(c['P:' + cls], null) : rd_('P:' + cls, null);
  if (!p) p = paceBlank_();
  if (cls !== DEMO) {
    var b = c['B:' + cls] != null ? j_(c['B:' + cls], {}) : rd_('B:' + cls, {});
    if (b[no] !== dev) return { kick: true };
  }
  var d = c.DECK != null ? j_(c.DECK, null) : rd_('DECK', null);
  var s = j_(c[sk], {}), out = { now: now, fast: !!c['L:' + cls], deck: d ? { t: d.t, n: d.n } : null };
  var g = rd_('GQ:' + cls, null);
  if ((g ? g.t : 0) !== (seen.g || 0)) out.g = g || { t: 0 };
  var sn = rd_('SNAP:' + cls, null), stk = (rd_('STK:' + cls, {}) || {})[no];   // 스냅샷(학생 화면에도), 나에게 온 스티커
  if (sn && sn.t !== (seen.sn || 0)) out.sn = sn;
  if (stk && stk.t !== (seen.sk || 0)) out.sk = stk;
  var hw = rd_('HW:' + cls, null); if (hw && hw.t !== (seen.hw || 0)) out.hw = hw;   // 과제 목록
  var my = (rd_('STAR:' + cls, {}) || {})[no]; if (my && my.t !== (seen.st || 0)) out.st = my;   // 내 누적 별
  var nk = nick_(cls)[no]; if (nk && nk !== (info && info.nick)) out.nk = nk;   // 선생님이 바꾼 닉네임
  if (p.v !== v) {
    out.p = p;
    if (p.v > (s.gv || 0)) { s.gv = p.v; s.lat = now - p.v; }   // 선생님이 바꾼 뒤 이 학생에게 닿기까지 걸린 시간
  }
  info = info || {};
  s.t = now; s.dev = String(dev).slice(-4);
  s.act = info.act == null ? null : str_(info.act, 30);
  s.scr = info.scr == null ? null : Number(info.scr);
  s.sig = ['g', 'y', 'r'].indexOf(info.sig) >= 0 ? info.sig : null;
  s.prog = Number(info.prog) || 0;
  s.help = Number(info.help) || 0;
  s.nick = str_(info.nick, 12); s.ani = str_(info.ani, 4);
  ST.cput(sk, JSON.stringify(s));
  return out;
}

/* 즉석 질문 답 — 질문이 열려 있을 때만, 닫힐 때까지 고칠 수 있다 */
function answer(cls, no, dev, qid, val) {
  cls = String(cls); no = Number(no);
  if (cls !== DEMO && rd_('B:' + cls, {})[no] !== dev) return { ok: false, msg: '다시 들어와 주세요' };
  var p = rd_('P:' + cls, paceBlank_());
  if (!p.q || p.q.id !== qid) return { ok: false, msg: '질문이 닫혔어요' };
  ST.cput('A:' + cls + ':' + qid + ':' + no, JSON.stringify({ v: str_(val, 200), t: ST.now() }));
  return { ok: true };
}

/* t 가 있으면 그 자료(예전에 올린 것도 — 활동 사이에 끼운 쪽), 없으면 마지막 자료 */
function getSlide(i, t) {
  var d = t ? rd_('DECK:' + t, null) : null;
  if (!d) { d = rd_('DECK', null); if (d && t && d.t !== t) d = null; }   // 이 기능 전에 올린 자료는 DECK 에만 있다
  if (!d || i < 0 || i >= d.n) return { ok: false };
  return { ok: true, i: i, t: d.t, img: ST.fileData(d.ids[i]) };
}

/* ---------------- 선생님 ---------------- */
function tLogin(code) {
  if (!okCode_(code)) return { ok: false, msg: '접속코드가 맞지 않아요' };
  return { ok: true, classes: rd_('CLASSES', []).concat([DEMO]), url: ST.url(), deck: rd_('DECK', null) };
}

function approve(code, cls, no, dev, yes) {
  if (!okCode_(code)) return { ok: false, msg: '접속코드가 맞지 않아요' };
  cls = String(cls); no = Number(no);
  return ST.lock(function () {
    var q = j_(ST.pget('Q:' + cls), []).filter(function (x) { return !(x.no === no && x.dev === dev); });
    wr_('Q:' + cls, q);
    if (yes) { var b = j_(ST.pget('B:' + cls), {}); b[no] = dev; wr_('B:' + cls, b); }
    else ST.cput('RJ:' + cls + ':' + no + ':' + dev, '1', 600);
    return { ok: true };
  });
}

/* no 가 없으면 반 전체 묶음 풀기 */
function unbind(code, cls, no) {
  if (!okCode_(code)) return { ok: false, msg: '접속코드가 맞지 않아요' };
  cls = String(cls);
  return ST.lock(function () {
    var b = j_(ST.pget('B:' + cls), {});
    if (no == null) b = {}; else delete b[Number(no)];
    wr_('B:' + cls, b);
    wr_('Q:' + cls, no == null ? [] : j_(ST.pget('Q:' + cls), []).filter(function (x) { return x.no !== Number(no); }));
    return { ok: true };
  });
}

/* patch 의 키만 바꾼다. v = 바꾼 시각(학생 쪽 도착 시간 계산에 쓴다) */
function setPace(code, cls, patch) {
  if (!okCode_(code)) return { ok: false, msg: '접속코드가 맞지 않아요' };
  cls = String(cls);
  var p = rd_('P:' + cls, paceBlank_());
  if (patch && 'act' in patch) {   // 활동을 바꾸면 화면 제한부터 풀고(같이 온 sync 는 아래에서 다시 건다) 그 활동의 구성을 싣는다
    p.sync = p.from = p.to = null;
    p.seq = patch.act ? rd_('SEQ:' + str_(patch.act, 30), null) : null;
  }
  PACE_KEYS.forEach(function (k) {
    if (!patch || !(k in patch)) return;
    var x = patch[k];
    if (k === 'timer') p.timer = x && Number(x.min) > 0 ? { end: ST.now() + Number(x.min) * 60000, min: Number(x.min), label: str_(x.label, 30) } : null;
    else if (k === 'q') {
      if (p.q) ST.delPrefix('A:' + cls + ':' + p.q.id + ':');   // 닫거나 바꾼 질문의 답은 지운다(쌓이지 않게)
      p.q = x ? { id: ST.now().toString(36), type: ['ox', 'choice', 'num', 'text'].indexOf(x.type) >= 0 ? x.type : 'text', n: Math.max(2, Math.min(5, Number(x.n) || 5)), text: str_(x.text, 120) } : null;
    }
    else if (k === 'act' || k === 'msg' || k === 'show') p[k] = x == null ? (k === 'msg' ? '' : null) : str_(x, 120);
    else if (k === 'pause') p.pause = !!x;
    else p[k] = x == null ? null : Math.max(0, Number(x) || 0);
  });
  p.v = ST.now();
  wr_('P:' + cls, p);
  return { ok: true, pace: p };
}

/* 진도판이 2~3초마다 부른다. 진도판이 열려 있는 동안 학생은 2초 간격으로 묻는다(L:반) */
function board(code, cls) {
  if (!okCode_(code)) return { ok: false, msg: '접속코드가 맞지 않아요' };
  cls = String(cls);
  ST.cput('L:' + cls, '1', 30);
  var ns = nos_(cls), p = rd_('P:' + cls, paceBlank_());

  /* ---------- 수업 상태 반영 ---------- */
  function allowed(i) { if (!P) return true; if (P.sync != null) return i === P.sync; if (P.from != null) return i >= P.from && i <= P.to; return true; }
  /* 화면 목록 = 선생님이 짠 구성(활동 화면 + 끼운 발표 쪽). 구성이 없으면 활동 화면 그대로 */
  function items() {

  $('next').onclick = function () { go(1); };

  /* 발표 — 자료가 올라오면 미리 한 쪽씩 받아 둔다(학생마다 0~15초 어긋나게), 지금 보여 줄 쪽이 먼저 */

  /* ================= 🎮 게임 — 학생 태블릿(student.html 의 IIFE 안에 끼워짐) =================

      if (!String(v).trim()) { toast('답을 써 주세요'); return; }

    }
  };

  /* 확인용(수업엔 안 쓰임) */
  window.__HUB = { st: function () { return { ME: ME, V: V, P: P, FAST: FAST, CUR: CUR, deck: { t: DK.t, n: DK.n, got: Object.keys(IMG).filter(function (k) { return k.indexOf(DK.t + ':') === 0; }).length }, imgs: Object.keys(IMG) }; } };
